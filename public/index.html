<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080C14" />
    <meta name="background-color" content="#080C14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alquimio" />
    <meta name="application-name" content="Alquimio" />
    <meta name="description" content="1-Tap Broadcast — publica en todas tus redes en un solo toque." />

    <!-- Forzar limpieza de caché en el HTML para actualizaciones en tiempo real -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Alquimio</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon e iconos Apple -->
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/images/icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icon.png" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; width: 100%; margin: 0; padding: 0; background-color: #080C14; overflow-x: hidden; }
      body {
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Registro Automático de Service Worker con Actualización en Tiempo Real -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('Service Worker registrado con éxito:', reg.scope);
            
            reg.update(); // Forzar actualización de red

            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker == null) return;
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('Alquimio PWA: Nueva actualización detectada. Forzando actualización...');
                  installingWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              };
            };
          }).catch((err) => {
            console.warn('Error al registrar el Service Worker:', err);
          });

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload(true);
            }
          });
        });
      }
    </script>
  </body>
</html>
